name: Browser investigation regression
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/browser-investigation.yml'
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: node tests/graph-layout-stress.mjs
      - run: npm run build
      - run: npx playwright test --config=playwright.config.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-regression-traces
          path: frontend/test-results/
          retention-days: 7
