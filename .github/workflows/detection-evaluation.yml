name: Detection evaluation tests

on:
  push:
    paths:
      - 'scripts/evaluate_detection.py'
      - 'scripts/build_labeling_queue.py'
      - 'tests/test_detection_evaluation.py'
      - 'tests/test_labeling_queue.py'
      - 'docs/DETECTION_EVALUATION.md'
      - '.github/workflows/detection-evaluation.yml'
  pull_request:
    paths:
      - 'scripts/evaluate_detection.py'
      - 'scripts/build_labeling_queue.py'
      - 'tests/test_detection_evaluation.py'
      - 'tests/test_labeling_queue.py'
      - 'docs/DETECTION_EVALUATION.md'
      - '.github/workflows/detection-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run standard-library evaluation tests
        run: |
          python -m unittest discover -s tests -p 'test_detection_evaluation.py' -v
          python -m unittest discover -s tests -p 'test_labeling_queue.py' -v
