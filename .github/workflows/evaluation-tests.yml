name: Evaluation regression tests
on:
  push:
    paths:
      - 'scripts/evaluate_rule_baseline.py'
      - 'tests/test_external_baseline.py'
      - 'tests/test_ingestion_resilience_regression.py'
      - 'tests/test_historical_evidence_regression.py'
      - 'src/api/historical_routes.py'
      - 'src/ingest/cursor.py'
      - 'src/ingest/loop.py'
      - 'src/ingest/expired_catchup.py'
      - 'tests/test_expired_catchup.py'
      - 'src/api/coverage_routes.py'
      - '.github/workflows/evaluation-tests.yml'
  workflow_dispatch:
jobs:
  evaluation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: pip install -r requirements.txt
      - name: Run baseline regression tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -c /dev/null --noconftest -p pytest_asyncio.plugin tests/test_external_baseline.py tests/test_ingestion_resilience_regression.py tests/test_historical_evidence_regression.py tests/test_expired_catchup.py -q
