name: Production quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python-source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile application and test sources
        run: python -m compileall -q src scripts tests
      - name: Install offline evidence verification test dependencies
        run: python -m pip install 'pytest==7.4.4' 'cryptography==50.0.1'
      - name: Test evidence checksums and Ed25519 signatures
        run: python -m pytest -q tests/test_verify_evidence_bundle.py tests/test_signed_evidence_bundle.py tests/test_evidence_cli_roundtrip.py
      - name: Verify bounded retention configuration
        run: |
          python - <<'PY'
          from src.storage_budget import bounded_retention_minutes
          assert bounded_retention_minutes(None) == 5
          assert bounded_retention_minutes("60") == 60
          for invalid in ("0", "61", "garbage"):
              try:
                  bounded_retention_minutes(invalid)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"unsafe retention accepted: {invalid}")
          PY

  browser-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1 @axe-core/playwright@4.11.0
      - run: npx playwright install --with-deps chromium
      - name: Start built frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/chainscope-preview.log 2>&1 &
          echo $! > /tmp/chainscope-preview.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/app/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chainscope-preview.log
          exit 1
      - name: Mobile and accessibility smoke
        env:
          BASE_URL: http://127.0.0.1:4173/app/
        run: node tests/browser-smoke.mjs

  production-load-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for hardened production deployment
        run: |
          for i in {1..60}; do
            code=$(curl -sS -o /tmp/queue.json -w "%{http_code}" "https://ai-poweredblockchain-production.up.railway.app/api/transaction-browser?limit=10&clustered=true" || true)
            if [ "$code" = "200" ]; then
              python - <<'PY'
          import json
          with open('/tmp/queue.json') as handle:
              payload = json.load(handle)
          assert payload.get('clustered') is True
          assert isinstance(payload.get('transactions'), list)
          assert payload['transactions'], 'production queue returned no transactions'
          print('Hardened clustered queue is live.')
          PY
              exit 0
            fi
            sleep 5
          done
          echo "Production never exposed a healthy clustered queue after deployment."
          cat /tmp/queue.json || true
          exit 1
      - name: Clustered queue load smoke
        run: >-
          python scripts/review_queue_load_test.py
          https://ai-poweredblockchain-production.up.railway.app/api
          --requests 120 --concurrency 12 --max-p95-ms 3000 --min-success-rate 0.98
      - name: Reset public rate-limit window
        run: sleep 65
      - name: Client-abort chaos smoke
        run: >-
          python scripts/review_queue_load_test.py
          https://ai-poweredblockchain-production.up.railway.app/api
          --requests 80 --concurrency 10 --chaos-rate 0.10 --max-p95-ms 3500 --min-success-rate 0.98
      - name: Live security and evidence smoke
        run: |
          set -euo pipefail
          BASE="https://ai-poweredblockchain-production.up.railway.app"
          TX_HASH=$(python - <<'PY'
          import json
          with open('/tmp/queue.json') as handle:
              print(json.load(handle)['transactions'][0]['hash'])
          PY
          )
          ADDRESS=$(python - <<'PY'
          import json
          with open('/tmp/queue.json') as handle:
              print(json.load(handle)['transactions'][0]['from_address'])
          PY
          )

          docs_code=$(curl -sS -o /tmp/docs.out -w "%{http_code}" "$BASE/docs")
          metrics_code=$(curl -sS -o /tmp/metrics.out -w "%{http_code}" "$BASE/metrics")
          analyst_code=$(curl -sS -o /tmp/analyst.out -w "%{http_code}" \
            -H 'Content-Type: application/json' \
            -d '{"status":"needs_review","note":"unauthenticated production smoke"}' \
            "$BASE/api/analyst/transactions/$TX_HASH")

          test "$docs_code" = "404"
          test "$metrics_code" = "404"
          test "$analyst_code" = "401"

          curl -fsSI "$BASE/app/" | grep -qi '^content-security-policy:'

          curl -fsS "$BASE/api/wallets/$ADDRESS/fund-flow?depth=1&limit=20&per_hop_limit=20" > /tmp/fund-flow.json
          python - <<'PY'
          import json
          with open('/tmp/fund-flow.json') as handle:
              payload = json.load(handle)
          assert payload.get('root')
          assert 'flow_summary' in payload
          assert 'coverage' in payload
          assert 'methodology' in payload
          PY

          events_code=$(curl -sS -o /tmp/events.json -w "%{http_code}" "$BASE/api/transactions/$TX_HASH/events")
          test "$events_code" = "200"
          python - <<'PY'
          import json
          with open('/tmp/events.json') as handle:
              payload = json.load(handle)
          assert payload.get('rpc_retrieval') == 'success'
          assert isinstance(payload.get('events'), list)
          PY

          echo "Live RBAC, internal-surface, CSP, fund-flow and receipt-event checks passed."
