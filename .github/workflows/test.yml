name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blockchain_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blockchain_analytics_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blockchain_analytics_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          ALCHEMY_API_KEY: dummy_key_for_ci
          ETHEREUM_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/dummy_key_for_ci
          OPENAI_API_KEY: not-set
          GROQ_API_KEY: not-set
          API_KEY: ci-test-key
          LLM_PROVIDER: ollama
          LLM_MODEL: llama3.2:1b
          OLLAMA_URL: http://localhost:11434
        run: |
          pytest tests/unit/ -v --no-header

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/