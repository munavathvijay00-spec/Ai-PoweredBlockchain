name: Transaction browser regression

on:
  push:
    branches: [main]
    paths:
      - "src/api/browse_routes.py"
      - "src/database/connection.py"
      - "tests/test_transaction_browser_contract.py"
      - "tests/test_scoring_checkpoint_guard.py"
      - "tests/test_zero_value_risk.py"
      - "src/risk/scorer.py"
      - "src/ingest/worker.py"
      - "scripts/audit_legacy_zero_value_scores.py"
      - ".github/workflows/transaction-browser.yml"
  workflow_dispatch:

jobs:
  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ALCHEMY_API_KEY: ci-placeholder
      ETHEREUM_RPC_URL: http://127.0.0.1:8545
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      API_KEY: ci-local-secret-not-for-deployment
      # Web3 exposes an incompatible optional pytest plugin; load only pytest.ini plugins.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned application and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run browser regression contracts
        run: python -m compileall -q scripts/audit_legacy_zero_value_scores.py src/ingest/worker.py src/risk/scorer.py
      - name: Run browser and scoring regression contracts
        run: python -m pytest tests/test_transaction_browser_contract.py tests/test_scoring_checkpoint_guard.py tests/test_zero_value_risk.py -q --no-cov
