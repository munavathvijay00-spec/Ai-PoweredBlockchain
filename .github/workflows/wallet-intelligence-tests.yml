name: Wallet intelligence checks

on:
  push:
    branches: [main]
    paths:
      - "src/api/indexed_transfer_routes.py"
      - "src/utils/config.py"
      - "tests/test_indexed_wallet_intelligence.py"
      - ".github/workflows/wallet-intelligence-tests.yml"
  pull_request:
    paths:
      - "src/api/indexed_transfer_routes.py"
      - "src/utils/config.py"
      - "tests/test_indexed_wallet_intelligence.py"
      - ".github/workflows/wallet-intelligence-tests.yml"

jobs:
  wallet-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install "pytest==7.4.4" "pytest-asyncio==0.23.3" "fastapi==0.109.0" "aiohttp==3.14.4" "pydantic-settings==2.1.0"
      - name: Run offline wallet intelligence tests
        run: python -m pytest -q tests/test_indexed_wallet_intelligence.py
